<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlenderSim: building slenderness and disaster lab</title>
<style>
:root{--bg:#e9edf3;--pn:rgba(250,252,255,.88);--tx:#122033;--mu:#586a80;--ac:#0b73d6;--ok:#0f9d58;--wn:#c77c00;--bd:#d33a3a;--ln:rgba(18,32,51,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a11;--pn:rgba(10,16,26,.84);--tx:#e4ecf6;--mu:#8798ad;--ac:#46b0ff;--ok:#34d399;--wn:#ffb738;--bd:#ff6464;--ln:rgba(255,255,255,.13)}}
:root[data-theme="dark"]{--bg:#060a11;--pn:rgba(10,16,26,.84);--tx:#e4ecf6;--mu:#8798ad;--ac:#46b0ff;--ok:#34d399;--wn:#ffb738;--bd:#ff6464;--ln:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background:#0a1018}
.card{position:fixed;background:var(--pn);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;overflow:auto}
#pn{left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px}
#hud{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:292px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px))}
h1{font:700 16px/1.2 ui-monospace,Menlo,monospace;margin:0 0 2px}
h2{font-size:11px;color:var(--mu);margin:14px 0 6px;font-weight:600}
p{margin:6px 0 0}small{color:var(--mu)}
label{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--ac);margin:2px 0}
button,select{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;cursor:pointer}
select{width:100%}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,transparent)}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.pri{background:var(--ac);color:#fff;border-color:transparent;font-weight:700}
.dz{display:flex;justify-content:space-between;gap:6px;margin-top:8px}.dz em{color:var(--mu);font-style:normal;text-align:right}
.vd{font-size:18px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--ln)}.kv b{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%}
#tag{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:#9fb4cc;font-size:11px;pointer-events:none;white-space:nowrap}
@media(max-width:820px){#pn{top:auto;left:8px;right:8px;width:auto;height:42vh;bottom:calc(8px + env(safe-area-inset-bottom,0px))}#hud{left:8px;right:8px;width:auto;top:calc(8px + env(safe-area-inset-top,0px));max-height:34vh}#tag{display:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div class="card" id="pn">
<h1>SlenderSim</h1><small>Pick a building, hit it with a disaster, see if it stands.</small>
<h2>Geometry</h2><div id="g"></div>
<h2>Material</h2><div class="seg" id="mat"></div>
<h2>Structural system</h2><select id="sys" aria-label="Structural system"></select>
<h2>Disasters and strength</h2><div id="dz"></div>
<div class="row"><button class="pri" id="run">Run simulation</button><button id="rs">Reset</button></div>
</div>
<div class="card" id="hud" aria-live="polite"></div>
<div id="tag">Ray-marched in WebGL: primary, shadow and reflection rays per pixel. Drag to orbit, scroll to zoom.</div>
<script>
const $=s=>document.querySelector(s),sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const MAT=[
{n:'Timber',E:7e9,Ep:11e9,rho:140,sig:1.6,z:.03,c:2200,al:5e-6,ft:15,d:.6,w:1,col:[.6,.4,.22],rf:.04},
{n:'Concrete',E:30e9,Ep:30e9,rho:380,sig:6,z:.02,c:2800,al:10e-6,ft:3,d:.9,w:.35,col:[.6,.6,.58],rf:.08},
{n:'Steel',E:24e9,Ep:200e9,rho:220,sig:8,z:.01,c:3300,al:12e-6,ft:250,d:1.15,w:.5,col:[.42,.5,.62],rf:.35},
{n:'Composite',E:34e9,Ep:35e9,rho:300,sig:9,z:.015,c:3600,al:11e-6,ft:3.5,d:1.1,w:.4,col:[.35,.58,.58],rf:.2}];
const SYS=[
{n:'Moment frame',chi:.018,psi:.16,R:6,cm:1,rf:.3},
{n:'Braced frame',chi:.04,psi:.24,R:5,cm:1.08,rf:.33},
{n:'Shear-wall core',chi:.035,psi:.22,R:4.5,cm:1.05,rf:.34},
{n:'Framed tube',chi:.06,psi:.36,R:5,cm:1.15,rf:.38},
{n:'Outrigger + core',chi:.075,psi:.32,R:5.5,cm:1.25,rf:.36}];
const EF=w=>w<38?0:w<49?1:w<60?2:w<74?3:w<89?4:5;
const DZ={
tor:{n:'Tornado',t:v=>{const w=25+85*v;return'EF'+EF(w)+', '+(w|0)+' m/s'}},
eq:{n:'Earthquake',t:v=>'M'+(4.5+4.5*v).toFixed(1)+', '+(.05+1.15*v).toFixed(2)+' g'},
rain:{n:'Heavy rain + flood',t:v=>((20+480*v)|0)+' mm/h, '+(.5+6*v).toFixed(1)+' m flood'},
ecl:{n:'Solar eclipse',t:v=>(((.1+.9*v)*100)|0)+'% cover, -'+(14*(.1+.9*v)).toFixed(0)+' °C'}};
const S={H:220,B:40,m:1,s:3,ph:0,run:0,dz:{tor:{on:1,v:.5},eq:{on:0,v:.5},rain:{on:0,v:.5},ecl:{on:0,v:.7}}};
let res,mx,sc=.03;
function an(H,B,mi,si,d){
 const M=MAT[mi],Y=SYS[si],I=B**4/12,EI=M.E*Y.chi*I,mb=M.rho*B*B,W=mb*H*9.81,
 T=1.787*H*H*Math.sqrt(mb/EI),Pr=W/(7.837*EI/(H*H)),am=1/Math.max(.03,1-Pr),
 Mc=M.sig*1e6*Y.psi*B**3/6,Gf=Math.min(2.2,1+.22*Math.sqrt(T*.02/M.z));
 const wind=(v,k)=>{const w=.78*v*v*B*k;return Math.max(w*H*H*.625*Gf*am/Mc,w*H**4/(8*EI)*Gf*am/H/.02)};
 const r=[];
 if(d.tor.on)r.push(['Tornado winds',wind(25+85*d.tor.v,1.25)]);
 if(d.eq.on){const a=.05+1.15*d.eq.v,Sa=2.5*a*(T<.6?1:.6/T)*(T>4?4/T:1),V=Sa*W*.8,Sd=Sa*9.81*T*T/39.48*1.3/H/.02;
  r.push(['Earthquake',Math.max(V*.77*H/(Y.R*M.d)*am/Mc,Sd)])}
 if(d.rain.on){const s=d.rain.v,dp=.5+6*s,fl=3270*dp**3*B,sc=1-.35*s*M.w;r.push(['Rain, wind + flood',(wind(12+28*s,1)+fl*am/Mc)/sc])}
 if(d.ecl.on){const dT=14*(.1+.9*d.ecl.v);r.push(['Eclipse (thermal)',Math.max(M.Ep*M.al*dT*.35/(M.ft*1e6),M.al*dT*.25*H/(2*B)/.01)])}
 const gov=Math.hypot(0,...r.map(x=>x[1])),n=H/3.8;
 return{T,Pr,r,gov,n,cost:B*B*n*M.c*Y.cm*(1+.8*(H/300)**1.5),st:Pr>=1||gov>1.5?2:gov>1?1:0,lam:2*H/(Y.rf*B)}}
function maxH(B,mi,si,d){let lo=5,hi=1600;if(!an(hi,B,mi,si,d).st)return hi;if(an(lo,B,mi,si,d).st)return 0;
 for(let i=0;i<30;i++){const m=(lo+hi)/2;an(m,B,mi,si,d).st?hi=m:lo=m}return lo}
const fmt=c=>c>=1e9?'$'+(c/1e9).toFixed(2)+'B':'$'+(c/1e6).toFixed(0)+'M';
$('#g').innerHTML='<label>Height<b id=Hv></b></label><input id=H type=range min=20 max=800 value=220 aria-label="Height"><label>Width (square plan)<b id=Bv></b></label><input id=B type=range min=8 max=120 value=40 aria-label="Width">';
$('#mat').innerHTML=MAT.map((m,i)=>`<button data-m=${i}>${m.n}</button>`).join('');
$('#sys').innerHTML=SYS.map((s,i)=>`<option value=${i}>${s.n}</option>`).join('');$('#sys').value=S.s;
$('#dz').innerHTML=Object.keys(DZ).map(k=>`<div class=dz><label style="margin:0"><input type=checkbox data-k=${k} ${S.dz[k].on?'checked':''}>${DZ[k].n}</label><em id=${k}_t></em></div><input type=range data-k=${k} min=0 max=100 value=${S.dz[k].v*100} aria-label="${DZ[k].n} strength">`).join('');
function upd(reset){
 if(reset){S.ph=0;S.run=0;$('#run').textContent='Run simulation'}
 S.H=+$('#H').value;S.B=+$('#B').value;S.s=+$('#sys').value;const H=S.H,B=S.B;
 res=an(H,B,S.m,S.s,S.dz);mx=maxH(B,S.m,S.s,S.dz);sc=6/Math.max(H,B*1.6,60);
 $('#Hv').textContent=H+' m';$('#Bv').textContent=B+' m';
 document.querySelectorAll('#mat button').forEach((b,i)=>b.className=i==S.m?'on':'');
 for(const k in DZ)$('#'+k+'_t').textContent=DZ[k].t(S.dz[k].v);
 const r=res,ar=H/B,cls=ar<3?'stocky':ar<5?'normal':ar<7?'slender':ar<10?'very slender':'extreme',
 vt=['Survives','Heavily damaged','Collapses'][r.st],vc=['--ok','--wn','--bd'][r.st],
 bars=r.r.length?r.r.map(x=>`<div class=kv><span>${x[0]}</span><b>${x[1].toFixed(2)}</b></div><div class=bar><i style="width:${Math.min(100,x[1]*66)}%;background:var(${x[1]<1?'--ok':x[1]<1.5?'--wn':'--bd'})"></i></div>`).join(''):'<small>No disaster applied. Switch one on at left.</small>';
 $('#hud').innerHTML=`<div class=vd style="color:var(${vc})">${vt}</div><small>Governing demand/capacity ${r.gov.toFixed(2)}${r.Pr>=1?'. Self-weight buckling.':''}</small>
<h2>Slenderness</h2>
<div class=kv><span>Aspect ratio H/B</span><b>${ar.toFixed(1)} (${cls})</b></div>
<div class=kv><span>Effective kL/r, k = 2</span><b>${r.lam.toFixed(0)}</b></div>
<div class=kv><span>Fundamental period</span><b>${r.T.toFixed(1)} s</b></div>
<div class=kv><span>Buckling P/Pcr</span><b>${r.Pr.toFixed(2)}</b></div>
<div class=kv><span>Max safe height at this width</span><b>${mx>=1600?'over 1600 m':mx<6?'none':Math.round(mx)+' m (H/B '+(mx/B).toFixed(1)+')'}</b></div>
<h2>Demand / capacity (1.0 = limit)</h2>${bars}
<h2>Rough cost</h2>
<div class=kv><span>Floors</span><b>${r.n|0}</b></div><div class=kv><span>Total</span><b>${fmt(r.cost)}</b></div>
<div class=kv><span>Per m² of floor</span><b>$${Math.round(r.cost/(B*B*r.n)).toLocaleString()}</b></div>
<p><small>Conceptual cantilever model for early sizing. Not for design: verify with a licensed structural engineer.</small></p>`}
$('#pn').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k){if(t.type=='checkbox')S.dz[k].on=+t.checked;else S.dz[k].v=t.value/100}upd(1)});
$('#mat').onclick=e=>{const b=e.target.closest('button');if(b){S.m=+b.dataset.m;upd(1)}};
$('#run').onclick=()=>{S.ph=.0001;S.run=1;$('#run').textContent='Simulating...'};
$('#rs').onclick=()=>upd(1);
upd();
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;uniform float T;uniform vec4 G,W,C,P,K,Q,Z,F;uniform vec3 M;
const vec3 SD=vec3(.555,.499,-.666);
vec3 SV;float SI;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float box(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
vec3 obj(vec3 p){
 p.xz-=K.xy;
 vec2 q=p.xy-vec2(G.y*.5,0.);
 float c=cos(G.w),s=sin(G.w);
 p.xy=vec2(c*q.x-s*q.y,s*q.x+c*q.y)+vec2(G.y*.5,0.);
 p.y/=1.-Q.y;
 p.x+=Q.y*G.y*.2*sin(p.y/G.x*14.+2.*sin(p.y/G.x*5.));
 p.z+=Q.y*P.w*.15*sin(p.y/G.x*11.);
 p.x-=G.z*pow(clamp(p.y/G.x,0.,1.),2.)+Q.w*smoothstep(Q.z-.05*G.x,Q.z+.05*G.x,p.y);
 return p;}
float bsd(vec3 p){vec3 o=obj(p);o.y-=G.x*.5;float k=1.-Q.x*clamp((o.y+G.x*.5)/G.x,0.,1.);return box(o,vec3(G.y*.5*k,G.x*.5,P.w*.5*k))*.85*(1.-Q.y)-.004;}
float BL(){return 4.8*max(G.y,.9);}
float lawn(vec2 g){float b=BL();vec2 l=abs(g/b-floor(g/b+.5));return 1.-step(.38,max(l.x,l.y));}
float tree(vec3 p){if(p.y>.7)return p.y-.6;vec2 c=floor(p.xz/.9)+.5;float h=hash(c);vec2 w=c*.9;
 if(h>.3||lawn(w)<.5||(abs(w.x)<G.y*.75+.6&&abs(w.y)<P.w*.75+.6))return .22;
 return min(length(p-vec3(w.x,.32,w.y))-.2,max(length(p.xz-w)-.025,p.y-.18));}
float map(vec3 p){float d=bsd(p),s=max(G.y,.9);
 d=min(d,box(p-vec3(-s*1.5,G.x*.14,-s*1.1),vec3(s*.4,G.x*.14,s*.4)));
 d=min(d,box(p-vec3(s*.5,G.x*.2,-s*1.9),vec3(s*.35,G.x*.2,s*.35)));
 d=min(d,box(p-vec3(-s*.4,G.x*.12,s*1.5),vec3(s*.3,G.x*.12,s*.3)));
 d=min(d,box(p-vec3(-s*4.4,G.x*.32,-s*2.6),vec3(s*1.1,G.x*.32,s*1.1)));
 d=min(d,box(p-vec3(s*4.6,G.x*.24,s*2.9),vec3(s*.95,G.x*.24,s*.95)));
 d=min(d,box(p-vec3(-s*3.4,G.x*.27,s*3.8),vec3(s*.9,G.x*.27,s*.9)));
 d=min(d,tree(p));
 d=min(d,box(p-vec3(-s*1.7,G.x*.1,s*.9),vec3(s*.45,G.x*.1,s*.5)));
 d=min(d,box(p-vec3(s*1.8,G.x*.15,-s*.5),vec3(s*.4,G.x*.15,s*.6)));
 d=min(d,box(p-vec3(s*.2,G.x*.07,s*2.),vec3(s*.7,G.x*.07,s*.4)));
 return d;}
float march(vec3 ro,vec3 rd,float tm,int n){float t=.01;for(int i=0;i<90;i++){if(i>=n)break;float d=map(ro+rd*t);if(d<.0006*t+.0004||t>tm)break;t+=d*.75;}return min(t,tm);}
float shadow(vec3 ro,vec3 rd){float r=1.,t=.02;for(int i=0;i<40;i++){float d=map(ro+rd*t);r=min(r,10.*d/t);t+=clamp(d,.03,.5);if(r<.002||t>14.)break;}return clamp(r,0.,1.);}
vec3 nrm(vec3 p){const vec2 k=vec2(1.,-1.);float h=.0012*(1.+G.x*.3);
 return normalize(k.xyy*map(p+k.xyy*h)+k.yyx*map(p+k.yyx*h)+k.yxy*map(p+k.yxy*h)+k.xxx*map(p+k.xxx*h));}
vec3 city(vec3 c,vec3 rd){
 float a=atan(rd.x,rd.z),nl=smoothstep(.1,.5,max(W.z,max(W.x,Z.x)*.5));
 for(int k=0;k<2;k++){float fk=float(k);float N=64.-fk*28.;
  float i=mod(floor(a*N/6.2832+N*.5),N);float h=.02+(.17-.09*fk)*pow(hash(vec2(i,fk+1.)),2.);
  if(rd.y<h&&rd.y>-.25){vec2 wp=vec2(a*N*4./6.2832,rd.y*(150.-60.*fk));
   float win=step(.55,hash(floor(wp)+fk))*step(.2,fract(wp.x))*step(.25,fract(wp.y));
   vec3 b=mix(vec3(.4,.46,.56),vec3(.17,.21,.29),fk)*(.35+.65*(1.-W.z))*(1.-.4*W.x);
   c=b+vec3(1.,.8,.5)*win*nl*.9;}}
 return c;}
vec3 sky(vec3 rd){
 float e=W.z,rn=W.x,tn=W.y;
 vec3 hor=mix(vec3(.78,.86,.95),vec3(.5,.25,.12),e);
 vec3 top=mix(vec3(.16,.36,.78),vec3(.01,.02,.07),e);
 vec3 c=mix(hor,top,pow(clamp(rd.y,0.,1.),.45));
 c=mix(c,vec3(.2,.23,.27)*(.5+.5*rd.y),rn*.85);
 c=mix(c,vec3(.17,.22,.19)*(.6+.4*rd.y),tn*.7);
 vec3 e1=normalize(cross(SV,vec3(0.,1.,0.))),e2=cross(e1,SV);
 float fw=dot(rd,SV);
 vec2 q=vec2(dot(rd,e1),dot(rd,e2));
 float r=fw>0.?length(q):9.;
 float sn=1.-smoothstep(.046,.052,r);
 float mn=1.-smoothstep(.046,.052,length(q-vec2((1.-e)*.11,0.)));
 float k=1.-rn*.8;
 c+=vec3(1.,.92,.75)*sn*12.*k;
 c+=vec3(.7,.8,1.)*(.0008/(r*r+.0006))*smoothstep(.6,1.,e)*k;
 c+=vec3(1.,.8,.55)*pow(max(fw,0.),90.)*(1.-e)*.5*k;
 c*=1.-.97*mn*max(sn,smoothstep(.8,1.,e));c=city(c,rd);
 return c;}
float crack(vec2 p){vec2 i=floor(p),f=fract(p);float a=8.,b=8.;
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 o=vec2(hash(i+g),hash(i+g+7.));float d=length(g+o-f);if(d<a){b=a;a=d;}else if(d<b)b=d;}
 return b-a;}
vec2 fac(vec2 uv){
 float nb=P.z,nf=C.w,sy=P.y;
 float gx=fract(uv.x*nb),gy=fract(uv.y*nf);
 float ww=min(.95,((sy>2.5&&sy<3.5)?.3:.68)*Z.z/.6);
 float gl=step(abs(gx-.5),ww*.5)*step(abs(gy-.5),min(.47,.3*Z.z/.6));
 float mem=1.-gl;
 if(sy>.5&&sy<1.5){vec2 q=fract(vec2(uv.x*nb*.5,uv.y*nf*.25));
  mem=max(mem,max(1.-smoothstep(0.,.06,abs(q.x-q.y)),1.-smoothstep(0.,.06,abs(q.x+q.y-1.))));gl*=1.-mem;}
 if(sy>1.5&&sy<2.5){float w=step(.27,abs(uv.x-.5));gl*=1.-w;mem=1.-gl;}
 if(sy>3.5){float bd=min(step(abs(uv.y-.33),.012)+step(abs(uv.y-.66),.012),1.);gl*=1.-bd;mem=max(mem,bd);}
 return vec2(gl,mem);}
vec3 hitc(vec3 p,vec3 rd){vec3 n=nrm(p);return vec3(.5,.52,.56)*(.2+.8*max(dot(n,SD),0.)*SI);}
vec3 shadeB(vec3 p,vec3 n,vec3 rd){
 float sh=shadow(p+n*.004,SD);
 vec3 amb=mix(vec3(.22,.24,.28),vec3(.5,.65,.9),n.y*.5+.5)*(.3+.7*(1.-W.z))*(1.-.5*W.x);
 float dif=max(dot(n,SD),0.)*sh*SI;
 if(bsd(p)>.02){if(tree(p)<.02)return vec3(.05,.2,.06)*(.4+hash(floor(p.xz*30.))*.3)*(dif*1.4+amb);
 float wg=step(.35,fract(p.y*16.))*step(.3,fract((p.x+p.z)*11.));
 float lt=step(.6,hash(floor(vec2(p.y*16.,(p.x+p.z)*11.))))*wg*smoothstep(.1,.5,max(W.z,W.x*.5));
 return mix(vec3(.46,.47,.5),vec3(.1,.16,.24),wg*.85)*(dif*1.5+amb)+vec3(1.,.8,.5)*lt*.8;}
 vec3 o=obj(p);
 if(o.y>G.x-.015)return vec3(.2)*(dif*1.4+amb);
 bool sx=abs(o.x)/G.y>abs(o.z)/P.w;
 float kk=1.-Q.x*clamp(o.y/G.x,0.,1.);float u=(sx?o.z/(P.w*kk):o.x/(G.y*kk))+.5,v=o.y/G.x;
 vec2 f=fac(vec2(u,v));
 vec2 cell=floor(vec2(u*P.z,v*C.w))+(sx?3.:7.);
 float zq=(v-Z.w)*3.2,zn=exp(-zq*zq),dl=clamp(W.w*(.3+1.4*zn),0.,1.);
 float br=step(hash(cell),max(max(dl*.8,Z.y),F.x*.45));
 float gl=f.x*(1.-br);
